<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 125" width="110" height="125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EAF0FA"/>
    </linearGradient>
    <linearGradient id="lbl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9500FF"/>
      <stop offset="100%" stop-color="#7900E0"/>
    </linearGradient>
    <linearGradient id="blk-y" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="blk-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="blk-p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="3.5" flood-color="#6D28D9" flood-opacity="0.22"/>
    </filter>
    <filter id="sh2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#6D28D9" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="110" height="125" rx="14" fill="url(#bg)"/>

  <!-- Hanging decoration left -->
  <line x1="15" y1="0" x2="15" y2="18" stroke="#BAE6FD" stroke-width="0.9" opacity="0.6"/>
  <circle cx="15" cy="23" r="5" fill="#E0F2FE" opacity="0.65"/>
  <circle cx="15" cy="23" r="2.5" fill="#F0F9FF" opacity="0.85"/>

  <!-- Hanging decoration right -->
  <line x1="93" y1="0" x2="93" y2="22" stroke="#FBCFE8" stroke-width="0.9" opacity="0.55"/>
  <ellipse cx="93" cy="27" rx="3.5" ry="4.5" fill="#FBCFE8" opacity="0.6"/>
  <ellipse cx="93" cy="27" rx="1.8" ry="2.3" fill="#FDF2F8" opacity="0.85"/>

  <!-- Stars -->
  <polygon points="86,8 87.6,13 93,13 88.8,16 90.3,21 86,18.2 81.7,21 83.2,16 79,13 84.4,13" fill="#FACC15" opacity="0.9"/>
  <polygon points="8,51 9,54.2 12.2,54.2 9.6,56 10.6,59.2 8,57.5 5.4,59.2 6.4,56 3.8,54.2 7,54.2" fill="#FACC15" opacity="0.65"/>
  <polygon points="98,73 98.5,74.8 100.5,74.8 99,76 99.5,77.8 98,76.8 96.5,77.8 97,76 95.5,74.8 97.5,74.8" fill="#FACC15" opacity="0.5"/>

  <!-- Soft decorative circles -->
  <circle cx="97" cy="42" r="4" fill="#E0F2FE" opacity="0.6"/>
  <circle cx="11" cy="38" r="3" fill="#FDF2F8" opacity="0.55"/>
  <circle cx="100" cy="66" r="2" fill="#FEF08A" opacity="0.5"/>

  <!-- ===== MAIN ILLUSTRATION: 3 BUILDING BLOCKS ===== -->
  <!-- Yellow block (top center) -->
  <g filter="url(#sh)">
    <rect x="41" y="26" width="28" height="28" rx="6" fill="url(#blk-y)"/>
  </g>
  <!-- Yellow block face -->
  <circle cx="50" cy="37" r="2.5" fill="#92400E" opacity="0.45"/>
  <circle cx="60" cy="37" r="2.5" fill="#92400E" opacity="0.45"/>
  <path d="M48.5,43 Q55,48 61.5,43" stroke="#92400E" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Blue block (bottom left) -->
  <g filter="url(#sh)">
    <rect x="21" y="60" width="28" height="28" rx="6" fill="url(#blk-b)"/>
  </g>
  <!-- Blue block face -->
  <circle cx="30" cy="71" r="2.5" fill="#0369A1" opacity="0.4"/>
  <circle cx="40" cy="71" r="2.5" fill="#0369A1" opacity="0.4"/>
  <path d="M28.5,77 Q35,82 41.5,77" stroke="#0369A1" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.38"/>

  <!-- Pink block (bottom right) -->
  <g filter="url(#sh)">
    <rect x="61" y="60" width="28" height="28" rx="6" fill="url(#blk-p)"/>
  </g>
  <!-- Pink block face -->
  <circle cx="70" cy="71" r="2.5" fill="#9D174D" opacity="0.4"/>
  <circle cx="80" cy="71" r="2.5" fill="#9D174D" opacity="0.4"/>
  <path d="M68.5,77 Q75,82 81.5,77" stroke="#9D174D" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.38"/>

  <!-- Shine dots on blocks (playful effect) -->
  <circle cx="46" cy="30" r="3" fill="white" opacity="0.35" filter="url(#sh2)"/>
  <circle cx="26" cy="64" r="2.5" fill="white" opacity="0.35" filter="url(#sh2)"/>
  <circle cx="66" cy="64" r="2.5" fill="white" opacity="0.35" filter="url(#sh2)"/>

  <!-- ===== LABEL BAR ===== -->
  <path d="M0,101 H110 V111 Q110,125 96,125 H14 Q0,125 0,111 Z" fill="url(#lbl)"/>
  <text x="55" y="117" text-anchor="middle"
        font-family="Roboto, Arial, sans-serif"
        font-size="9.5" font-weight="700"
        fill="white" letter-spacing="0.4">Beb&#xE9;s</text>
</svg>
